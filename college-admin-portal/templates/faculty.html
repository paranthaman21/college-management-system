<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Admin Portal - Faculty</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        /* Reuse sticky form styles from students.html */
        .sticky-form-container {
            position: sticky;
            top: 20px;
            z-index: 10;
            background: var(--bg-main);
            padding-bottom: 20px;
        }

        .add-form {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .table-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th,
        td {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: #F8FAFC;
            font-weight: 600;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            width: 90%;
            max-width: 400px;
            text-align: center;
            transform: scale(0.95);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .modal-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn-danger {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-danger:hover {
            background-color: #dc2626;
            transform: translateY(-2px);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes popIn {
            to {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">
            <h2><i class="fa-solid fa-graduation-cap"></i> Admin</h2>
        </div>
        <nav class="menu">
            <a href="/"><i class="fa-solid fa-house"></i> Dashboard</a>
            <a href="/students.html"><i class="fa-solid fa-user-graduate"></i> Students</a>
            <a href="/faculty.html" class="active"><i class="fa-solid fa-chalkboard-user"></i> Faculty</a>
            <a href="#"><i class="fa-solid fa-bullhorn"></i></a>
            <a href="#"><i class="fa-solid fa-chart-pie"></i></a>
            <a href="/logout" class="logout"><i class="fa-solid fa-right-from-bracket"></i></a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="top-bar">
            <h1>Faculty Management</h1>
            <div class="user-profile">
                <span>Admin User</span>
            </div>
        </header>

        <!-- Sticky Add Faculty Form -->
        <div class="sticky-form-container">
            <h3 style="margin-bottom: 10px;">➕ Add New Faculty</h3>
            <form id="addFacultyForm" class="add-form">
                <div class="form-group">
                    <label>Faculty Name</label>
                    <input type="text" id="fName" placeholder="Enter Faculty Name" required>
                </div>
                <div class="form-group">
                    <label>Department</label>
                    <select id="fDept" required>
                        <option value="">Select</option>
                        <option value="CSE">CSE</option>
                        <option value="ECE">ECE</option>
                        <option value="MECH">MECH</option>
                        <option value="CIVIL">CIVIL</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="fEmail" placeholder="Enter Email Address" required>
                </div>
                <div class="form-group">
                    <label>Contact</label>
                    <input type="tel" id="fContact" placeholder="Enter Contact Number" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-group" style="display: flex; align-items: center; gap: 10px;">
                        <input type="text" id="fPassword" placeholder="*******" readonly required>
                        <button type="button" id="genPassBtn" class="btn btn-secondary"
                            style="padding: 8px 15px; font-size: 0.9rem;">Generate Password</button>
                    </div>
                </div>
                <input type="hidden" id="fRealPassword">

                <button type="submit" class="btn btn-primary"
                    style="margin-left: 100px; padding: 20px 10px; width: 150px;">Add Faculty</button>
            </form>
        </div>

        <!-- Table -->
        <div class="table-container">
            <div
                style="padding: 15px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px;">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="facultySearchInput" placeholder="Search faculty by name, email, or department..."
                    style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem;">
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Email</th>
                        <th>Contact</th>
                        <th>Password</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="facultyTableBody">
                    <!-- JS will fill this -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div style="margin-bottom: 15px; font-size: 3rem; color: #ef4444;">
                <i class="fa-solid fa-circle-exclamation"></i>
            </div>
            <h3 style="margin-bottom: 10px; color: var(--text-main);">Confirm Deletion</h3>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Are you sure you want to delete this faculty
                member? This action cannot be undone.</p>
            <div class="modal-actions">
                <button onclick="closeDeleteModal()" class="btn btn-secondary">Cancel</button>
                <button id="confirmDeleteBtn" class="btn btn-danger">Delete</button>
            </div>
        </div>
    </div>
    <script src="/static/js/faculty.js"></script>
</body>

</html>
